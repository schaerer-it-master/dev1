# Netlify: set "Base directory" to aether-fragrance (or deploy this folder directly).
# The site is exported as plain static files into ./out — no server functions needed.
[build]
  command = "npm run export"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# hashed build assets never change → cache them for a year
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
